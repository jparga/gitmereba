[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
# Solo avisos de «sin mantenimiento» (ninguno de vulnerabilidad) en dependencias
# transitivas de Tauri 2 que no podemos sustituir. Revisar al subir de versión de Tauri.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: macro de compilación de gtk-rs (Tauri); no llega al binario" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: transitiva de urlpattern (Tauri); tablas Unicode estáticas" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: transitiva de urlpattern (Tauri); tablas Unicode estáticas" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: transitiva de urlpattern (Tauri); tablas Unicode estáticas" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: transitiva de urlpattern (Tauri); tablas Unicode estáticas" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: transitiva de urlpattern (Tauri); tablas Unicode estáticas" },
    # Sin mantenimiento (no vulnerabilidad), sin versión sustituta: piezas de zbus, que llega por
    # el llavero (secret-service), las notificaciones y el diálogo de carpeta. Revisar al subir zbus.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: transitiva de zbus (llavero, notificaciones, diálogo)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: transitiva de zbus (llavero, notificaciones, diálogo)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: transitiva de zbus (llavero, notificaciones, diálogo)" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
