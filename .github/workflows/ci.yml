name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Semanal (lunes 05:17 UTC): detecta avisos de seguridad nuevos en dependencias.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar dependencias del sistema (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libdbus-1-dev

      - name: Instalar la toolchain fijada en rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Instalar cargo-nextest, cargo-deny y cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit

      - name: Caché de compilación
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pruebas
        # GITMEREBA_TEST_GITEA queda sin definir: las pruebas con Gitea real se saltan.
        run: cargo nextest run --workspace --no-tests=pass --no-fail-fast

      - name: Licencias y fuentes (cargo deny)
        run: cargo deny check

      - name: Avisos de seguridad (cargo audit)
        run: cargo audit
